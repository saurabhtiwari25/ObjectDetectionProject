name: CI - Smart Vision Monitor

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install system dependencies (OpenCV headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install CPU PyTorch
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff Linter Check
        run: |
          ruff check src tests scripts

      - name: Ruff Format Check
        run: |
          ruff format src tests scripts --check

      - name: Run Test Suite with Coverage Gate (>=80%)
        run: |
          pytest tests/ -v --cov=vision_monitor --cov-report=term-missing --cov-fail-under=80
