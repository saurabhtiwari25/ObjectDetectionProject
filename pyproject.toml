[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-vision-monitor"
version = "0.1.0"
description = "Real-time object detection and distance-monitoring application"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [
    {name = "Saurabh"},
]

dependencies = [
    "opencv-python>=5.0.0",
    "torch>=2.14.0",
    "torchvision>=0.24.0",
    "ultralytics>=8.4.0",
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.0",
]
depthai = [
    "depthai>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests that load real models (deselect with '-m \"not slow\"')",
    "hardware: marks tests requiring physical hardware",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["vision_monitor"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
